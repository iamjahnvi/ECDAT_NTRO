<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ECDAT V4-white — "Node Constellation" on white bg, deep-contrast interior -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- constellation edges (deep indigo, bolder) -->
  <path d="M32 11 L46 16.5 V31 C46 40.5 39.5 46.5 32 50.5 C24.5 46.5 18 40.5 18 31 V16.5 Z"
        fill="none" stroke="#3435A8" stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- perimeter nodes (deep indigo, solid) -->
  <circle cx="32" cy="11" r="3.4" fill="#2828A8"/>
  <circle cx="46" cy="16.5" r="3.4" fill="#2828A8"/>
  <circle cx="18" cy="16.5" r="3.4" fill="#2828A8"/>
  <circle cx="46" cy="31" r="3.1" fill="#2828A8"/>
  <circle cx="18" cy="31" r="3.1" fill="#2828A8"/>
  <circle cx="32" cy="50.5" r="3.1" fill="#2828A8"/>
  <!-- central encrypted-key core (near-black, bolder) -->
  <line x1="32" y1="22" x2="32" y2="37" stroke="#0B0B13" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="27.5" y="23.5" width="9" height="9" rx="1.5" transform="rotate(45 32 28)" fill="#0B0B13"/>
  <circle cx="32" cy="28" r="1.8" fill="#FFFFFF"/>
  <line x1="32" y1="31" x2="37" y2="31" stroke="#076A87" stroke-width="2.5" stroke-linecap="round"/>
  <!-- signal accent (deep green) -->
  <circle cx="32" cy="39.5" r="3.1" fill="#0C7A3D" stroke="#FFFFFF" stroke-width="1.25"/>
</svg>
