  <line x1="32" y1="34.5" x2="37.5" y2="34.5" stroke="#4CD7F6" stroke-width="2.25" stroke-linecap="round"/>
  <circle cx="39" cy="34.5" r="1.9" fill="#4CD7F6"/>
